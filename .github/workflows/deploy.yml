name: Deploy to drwinmac.tech

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show deployed commit
        run: git log -1 --oneline

      - name: Ensure assets/blog directory exists on server
        run: |
          sudo apt-get install -y lftp -q
          lftp -e "mkdir -p assets/blog; quit" \
            -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            ${{ secrets.FTP_HOST }} || true

      - name: Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            **/node_modules/**
            DrWinMacBlogSystem/**
            Backup/**
            **/.*
